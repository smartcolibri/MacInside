name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    # Pinned image + Xcode by path (see actions/runner-images,
    # images/macos/macos-26-arm64-Readme.md). Xcode 27 is still "preview"
    # on GitHub-hosted runners, so stay on the stable 26.x default.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PACKAGES_DIR: ${{ github.workspace }}/.build/SourcePackages
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Package.resolved lives inside the generated (git-ignored) xcodeproj,
      # so the cache is keyed on project.yml, where the Sparkle requirement is.
      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PACKAGES_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MacInside.xcodeproj \
            -scheme MacInside \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (unsigned)
        run: |
          set -o pipefail
          xcodebuild test \
            -project MacInside.xcodeproj \
            -scheme MacInside \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$PACKAGES_DIR" \
            CODE_SIGNING_ALLOWED=NO

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=""
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q '[^[:space:]]'; then
              missing="$missing $sha"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These commits lack a 'Signed-off-by:' trailer (Developer Certificate of Origin):"
            for sha in $missing; do
              echo "  $(git log -1 --format='%h %s' "$sha")"
            done
            echo
            echo "Fix: sign off your commits, then force-push the branch."
            echo "  Last commit only:   git commit --amend --no-edit -s"
            echo "  Whole branch:       git rebase --signoff $BASE_SHA"
            echo "  Then:               git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
