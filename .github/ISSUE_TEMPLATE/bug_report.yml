name: Bug report
description: Something in MacInside does not work as expected
labels: ["bug"]
body:
  - type: input
    id: app_version
    attributes:
      label: MacInside version
      description: "MacInside > About MacInside"
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 14.6"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: "MacBook Pro 14-inch, Apple M1 Pro"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where does it happen?
      description: Which card, widget, menu bar item or window (dashboard, process manager, settings...)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include screenshots if helpful.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
