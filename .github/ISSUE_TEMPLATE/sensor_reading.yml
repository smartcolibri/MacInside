name: Sensor reading wrong or missing
description: A temperature, fan, power, GPU or battery value is wrong or absent on your Mac
labels: ["bug", "area:sensors", "needs-hardware-test"]
body:
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: "Mac Studio (2022), Apple M1 Max"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 14.6"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: MacInside version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Card, widget or menu bar item
      placeholder: "Sensors card / Fans widget / menu bar CPU icon"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected value
      description: What you expect, and where you got the reference (another tool, spec...).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What MacInside shows
    validations:
      required: true
  - type: input
    id: smc_key
    attributes:
      label: SMC key (if known)
      placeholder: "TC0P"
