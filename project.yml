name: MacInside
options:
  bundleIdPrefix: fr.vincentlauriat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: fr

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

settings:
  base:
    DEVELOPMENT_TEAM: "KFLACS69T9"
    ENABLE_HARDENED_RUNTIME: YES
    # Version partagée par l'app et l'extension widget : macOS attend qu'une
    # extension embarquée porte la même version que son app hôte. Définie ici
    # plutôt que dans chaque target, sinon un bump manuel de l'app seule les
    # désynchronise. (`release.sh` les surcharge de toute façon en ligne de
    # commande, ce qui s'applique à tous les targets.)
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  MacInside:
    build:
      targets:
        MacInside: all
        MacInsideTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacInsideTests
    archive:
      config: Release

targets:
  MacInside:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacInside
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    dependencies:
      - package: Sparkle
      - target: MacInsideWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: MacInside
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.macinside
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: MacInside/MacInside.entitlements
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
    info:
      path: MacInside/Info.plist
      properties:
        CFBundleName: MacInside
        CFBundleDisplayName: MacInside
        CFBundleIdentifier: fr.vincentlauriat.macinside
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en]
        SUFeedURL: "https://raw.githubusercontent.com/smartcolibri/MacInside/main/appcast.xml"
        SUPublicEDKey: "tFXsHOjAq+eXyeVuav0ojm3XQ8SgLVV1HrXvKLJ2U4I="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: false
        NSHumanReadableCopyright: "© 2026 Vincent Lauriat"
        NSHighResolutionCapable: true

  # Extension WidgetKit. Obligatoirement sandboxée (contrainte macOS sur les app
  # extensions) alors que l'app ne l'est pas : elle ne lit donc aucun capteur
  # elle-même, seulement l'instantané déposé par l'app dans l'App Group partagé.
  MacInsideWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      # Modèle + accès au conteneur partagé, compilés dans les deux cibles.
      - path: MacInside/Shared
      - path: MacInside/Formatters.swift
      # Le catalogue de chaînes est référencé, pas dupliqué : une seule source
      # de vérité pour les traductions FR/EN de l'app et des widgets.
      - path: MacInside/Localizable.xcstrings
      - path: MacInsideWidgets
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_NAME: MacInsideWidgets
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.macinside.widgets
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: MacInsideWidgets/MacInsideWidgets.entitlements
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
    info:
      path: MacInsideWidgets/Info.plist
      properties:
        CFBundleName: MacInsideWidgets
        CFBundleDisplayName: MacInside
        CFBundleIdentifier: fr.vincentlauriat.macinside.widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MacInsideTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacInsideTests
    dependencies:
      - target: MacInside
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
